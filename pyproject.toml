[tool.poetry]
name = "colabfold"
version = "1.6.3"
description = "Making protein folding accessible to all. Predict proteins structures both in google colab and on your machine"
authors = [
    "Milot Mirdita <milot@skku.edu>",
    "Sergey Ovchinnikov <so@fas.harvard.edu>",
    "Martin Steinegger <martin.steinegger@snu.ac.kr>",
    "Kostantin Schütze <schuetze@in.tum.de>",
    "Yoshitaka Moriwaki",
    "Lim Heo",
]
readme = "README.md"
license = "MIT, but separate licenses for the trained weights"
repository = "https://github.com/sokrypton/ColabFold"
classifiers = [
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.poetry.dependencies]
python = ">=3.10"
absl-py = { version = ">=1.0.0,<3", optional = true }
# jax 0.11.2 renamed hijax.HiPrimitive, and released flax, which tokamax imports, still asks for it
jax = { version = ">=0.6.2,<0.11.2", optional = true }
matplotlib = "^3.8.4"
biopython = "<1.86"
numpy = "^2.0.2"
pandas = "^2.2.2"
alphafold-colabfold = { version = "2.3.21", optional = true }
#alphafold-colabfold = { path = "..", develop = true, optional = true }
colabfold-binaries = { version = "^0.1.0", optional = true, markers = "sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')" }
colabfold-kernels = { version = "^0.4.0", optional = true }
requests = "^2.26.0"
tqdm = "^4.62.2"
appdirs = "^1.4.4"
py3Dmol = { version = "^2.0.1", optional = true }
dm-tree = { version = "^0.1.9", optional = true }
dm-haiku = { version = "^0.0.17", optional = true }
importlib-metadata = "^8.6.1"
pdbfixer = { version = "^1.12.0", optional = true }
openmm = { version = ">=8.5,<9", optional = true }
rdkit = { version = "==2025.9.4", optional = true, python = ">=3.12" }
tokamax = { version = "==0.0.12", optional = true, python = ">=3.12" }
alphafold3-colabfold = { version = "3.1.13", optional = true, python = ">=3.12" }
orjson = "^3.11.4"

[tool.poetry.dev-dependencies]
# The latest version conflicts with tensorflow over typing-extensions
black = "^23.1.0"
pytest = "^6.2.5"

[tool.poetry.extras]
alphafold = ["alphafold-colabfold", "colabfold-kernels", "colabfold-binaries", "jax", "absl-py", "dm-tree", "dm-haiku",  "py3Dmol"]
alphafold-minus-jax = ["alphafold-colabfold", "colabfold-kernels", "colabfold-binaries", "absl-py", "dm-tree", "dm-haiku", "py3Dmol"]
openmm = ["openmm", "pdbfixer"]
alphafold3 = ["alphafold3-colabfold", "colabfold-kernels", "colabfold-binaries", "jax", "absl-py", "dm-haiku", "rdkit", "tokamax"]
alphafold3-minus-jax = ["alphafold3-colabfold", "colabfold-kernels", "colabfold-binaries", "absl-py", "dm-haiku", "rdkit", "tokamax"]

[tool.pytest.ini_options]
addopts = "--tb=short"

[tool.poetry.scripts]
colabfold_batch = 'colabfold.batch:main'
colabfold_search = 'colabfold.mmseqs.search:main'
colabfold_split_msas = 'colabfold.mmseqs.split_msas:main'
colabfold_relax = 'colabfold.relax:main'

[tool.black]
# Format only the new package, don't touch the existing stuff
include = '''
/(
  | colabfold
  | tests
)/
'''
# The colabfold.py exclude doesn't work, but the "fmt: off" inside of it does
extend-exclude = '''
/(
  | __pycache__
  | colabfold/colabfold.py
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

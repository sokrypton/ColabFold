name: Build and Test CAAT Container
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'images/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'colabfold/**'
      - 'alphafold/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'test-data/**'
      - '.github/workflows/apptainer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghcr-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Apptainer
        run: |
          wget -q https://github.com/apptainer/apptainer/releases/download/v1.4.5/apptainer_1.4.5_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./apptainer_1.4.5_amd64.deb
          rm apptainer_1.4.5_amd64.deb

      - name: Build image and run offline smoke test
        run: |
          sudo apptainer build caat.sif images/caat.def
          sudo chown "$(id -u):$(id -g)" caat.sif

      - name: Test packaged CAAT code as an unprivileged user
        run: |
          mkdir -p "$RUNNER_TEMP/caat-tests"
          apptainer exec --cleanenv --pwd /work \
            --bind "$RUNNER_TEMP/caat-tests:/work" \
            --env JAX_PLATFORMS=cpu --env MPLCONFIGDIR=/work/mpl \
            caat.sif python -m pytest /opt/CAAT/tests \
            --ignore=/opt/CAAT/tests/test_colabfold.py \
            -p no:cacheprovider --junitxml=/work/results.xml
          apptainer test --cleanenv caat.sif

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-test-results
          path: ${{ runner.temp }}/caat-tests/results.xml

      - name: Upload tested image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: caat-image
          path: caat.sif
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  ghcr-publish:
    # Serialize registry writes; completion order need not match commit order.
    concurrency:
      group: caat-ghcr-publish
      cancel-in-progress: false
    needs: ghcr-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: caat-image

      - name: Install Apptainer
        run: |
          wget -q https://github.com/apptainer/apptainer/releases/download/v1.4.5/apptainer_1.4.5_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./apptainer_1.4.5_amd64.deb
          rm apptainer_1.4.5_amd64.deb

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Publish tested image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sif_sha=$(sha256sum caat.sif | cut -d ' ' -f 1)
          image_uri="oras://ghcr.io/prameshsharma25/caat:sha-${GITHUB_SHA}-sif-${sif_sha}"
          apptainer push caat.sif "$image_uri"
          printf 'Published image: `%s`\n\nSIF SHA-256: `%s`\n' "$image_uri" "$sif_sha" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$GITHUB_SHA" = "$main_sha" ]; then
              apptainer push caat.sif oras://ghcr.io/prameshsharma25/caat:latest
            else
              echo "Skipping latest: $GITHUB_SHA is no longer the head of main ($main_sha)."
            fi
          fi
